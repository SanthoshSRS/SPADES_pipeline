# Configuration for 100% production training
# Full 50-hour training for competition submission

seed: 42

data:
  h5_dir: "h5"
  sequence_ids_100pct: "sequence_ids_100pct.txt"
  height: 720
  width: 1280
  num_bins: 3  # 3-channel exponential decay representation
  window_size_us: 100000.0  # 100ms window
  min_events: 0  # space imagery is sparse in 100ms windows
  sequence_stride: 5  # Not used for single-frame mode
  val_ratio: 0.1  # 10% validation split (27 sequences)
  
model:
  num_input_channels: 3  # 3-channel exponential decay
  sequence_length: 1  # DirectPoseCNN, no GRU
  dropout: 0.2
  pretrained_backbone: true
  backbone: "resnet50"  # resnet50: more capacity, fits easily at seq=1
  
loss:
  lambda_translation: 1.0
  lambda_rotation: 10.0   # rotation is the bigger problem; push harder
  
training:
  batch_size: 64         # safe at seq=1 native res; 4× more stable gradients
  num_epochs: 100
  learning_rate: 0.0002  # linear scale: 5e-5 × (64/16) = 2e-4
  weight_decay: 0.00001
  num_workers: 0         # 0 = synchronous loading, no workers, no /dev/shm — avoids all IPC crashes
  
  # Learning rate scheduler
  scheduler_factor: 0.5
  scheduler_patience: 15  # more patience for larger-batch training
  
  # Early stopping
  early_stopping_patience: 30  # Stop if no improvement for 30 epochs
  
logging:
  checkpoint_dir: "checkpoints"
  tensorboard_dir: "logs"
  save_frequency: 1  # Save checkpoint every epoch
  
# Target performance (beat SPADES paper baseline):
# - Translation error: < 5%
# - Rotation error: < 10 degrees (vs SPADES 79 degrees)
# - Composite error: Minimal train/val gap
