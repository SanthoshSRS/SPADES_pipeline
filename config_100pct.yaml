# Configuration for 100% production training
# Full 50-hour training for competition submission

seed: 42

data:
  h5_dir: "h5"
  sequence_ids_100pct: "sequence_ids_100pct.txt"
  height: 720
  width: 1280
  num_bins: 3  # 3-channel exponential decay representation
  window_size_us: 100000.0  # 100ms window
  min_events: 0  # space imagery is sparse in 100ms windows
  sequence_stride: 5  # Not used for single-frame mode
  val_ratio: 0.1  # 10% validation split (27 sequences)
  
model:
  num_input_channels: 3  # 3-channel exponential decay
  sequence_length: 10  # CNN+GRU temporal model (1 second at 10 Hz)
  dropout: 0.2
  pretrained_backbone: true
  backbone: "resnet18"  # resnet18: ~4x faster per frame, allows larger batch at native res
  
loss:
  lambda_translation: 1.0
  lambda_rotation: 5.0   # balanced — was 10.0 (too aggressive for rotation)
  
training:
  batch_size: 32         # A100-80GB easily fits batch 32 with AMP; was 16
  num_epochs: 100
  learning_rate: 0.0001    # linear scaling: 5e-5 × (32/16) = 1e-4
  weight_decay: 0.00001
  num_workers: 20        # slightly more workers to feed larger batches
  
  # Learning rate scheduler
  scheduler_factor: 0.5
  scheduler_patience: 10  # More patience for full training
  
  # Early stopping
  early_stopping_patience: 20  # Stop if no improvement for 20 epochs
  
logging:
  checkpoint_dir: "checkpoints"
  tensorboard_dir: "logs"
  save_frequency: 1  # Save checkpoint every epoch
  
# Target performance (beat SPADES paper baseline):
# - Translation error: < 5%
# - Rotation error: < 10 degrees (vs SPADES 79 degrees)
# - Composite error: Minimal train/val gap
